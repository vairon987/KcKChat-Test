<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KCK Chat</title>
<script src="https://unpkg.com/peerjs@1.5.3/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{margin:0;background:#0f0f0f;color:#fff;display:flex;flex-direction:column;height:100vh}
header{padding:16px;background:#1a1a1a;border-bottom:1px solid #2a2a2a;display:flex;justify-content:space-between}
#myId{background:#222;padding:6px 10px;border-radius:8px;font-size:13px;cursor:pointer;border:1px dashed #444}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:75%;padding:10px 14px;border-radius:18px;font-size:14px}
.me{align-self:flex-end;background:#fff;color:#000}
.them{align-self:flex-start;background:#222}
#joinBox,#controls{padding:12px;background:#1a1a1a;display:flex;gap:8px;border-top:1px solid #2a2a2a}
input{flex:1;background:#111;border:1px solid #333;color:#fff;padding:12px;border-radius:12px}
button{background:#fff;color:#000;border:0;padding:12px 16px;border-radius:12px;font-weight:700}
</style>
</head>
<body>
<header>
  <div><b>KCK-UNV CHAT</b><div id="status" style="font-size:12px;color:#888">Connecting...</div></div>
  <div id="myId">...</div>
</header>
<div id="chat"></div>
<div id="joinBox">
  <input id="peerIdInput" placeholder="Tempel ID teman..." />
  <button id="connectBtn">Connect</button>
</div>
<div id="controls">
  <input id="msgInput" placeholder="Ketik pesan..." />
  <button id="sendBtn">Kirim</button>
</div>
<script>
const chatEl=document.getElementById('chat'),statusEl=document.getElementById('status'),myIdEl=document.getElementById('myId');
function addBubble(t,w){let d=document.createElement('div');d.className='bubble '+w;d.textContent=t;chatEl.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight}
const peer=new Peer('KCK-'+Math.random().toString(36).substring(2,6).toUpperCase());
let conn=null;
peer.on('open',id=>{myIdEl.textContent=id;statusEl.textContent='Online - Share ID ini';});
peer.on('connection',c=>{conn=c;setup()});
function setup(){statusEl.textContent='Terhubung ke '+conn.peer;conn.on('data',d=>addBubble(d,'them'));conn.on('close',()=>statusEl.textContent='Terputus')}
document.getElementById('connectBtn').onclick=()=>{let id=document.getElementById('peerIdInput').value.trim();conn=peer.connect(id);conn.on('open',setup)};
function send(){let txt=document.getElementById('msgInput').value.trim();if(!txt||!conn)return alert('Belum connect!');conn.send(txt);addBubble(txt,'me');document.getElementById('msgInput').value=''}
document.getElementById('sendBtn').onclick=send;
document.getElementById('msgInput').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
myIdEl.onclick=()=>{navigator.clipboard.writeText(myIdEl.textContent);myIdEl.textContent='Copied!';setTimeout(()=>myIdEl.textContent=peer.id,1000)};
</script>
</body>
</html>
